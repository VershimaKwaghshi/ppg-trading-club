<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a6520;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#c4a050;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5e098;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#c4a050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a6520;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#c4a050;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8d080;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#c4a050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050814;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleglow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->

  <rect width="700" height="220" fill="url(#bgGrad)"/>

  <!-- TRADING CLUB - top eyecatcher, italic serif, large -->

<text
x=“350”
y=“82”
font-family=“Georgia, ‘Times New Roman’, serif”
font-size=“52”
font-weight=“700”
font-style=“italic”
fill=“url(#goldGrad)”
text-anchor=“middle”
letter-spacing=“6”
filter=“url(#glow)”

> Trading Club</text>

  <!-- Thin horizontal rules flanking PENNY PARTNERS GROUP -->

  <line x1="38" y1="122" x2="178" y2="122" stroke="url(#goldGrad2)" stroke-width="0.9" opacity="0.7"/>
  <line x1="522" y1="122" x2="662" y2="122" stroke="url(#goldGrad2)" stroke-width="0.9" opacity="0.7"/>

  <!-- PENNY PARTNERS GROUP -->

<text
x=“350”
y=“128”
font-family=“Arial, Helvetica, sans-serif”
font-size=“13”
font-weight=“600”
fill=“url(#goldGrad2)”
text-anchor=“middle”
letter-spacing=“10”
filter=“url(#subtleglow)”

> PENNY PARTNERS GROUP</text>

  <!-- Bottom thin rule - full width, very subtle -->

  <line x1="38" y1="158" x2="662" y2="158" stroke="#c4a050" stroke-width="0.6" opacity="0.2"/>

  <!-- PPG in small refined caps bottom center -->

<text
x=“350”
y=“185”
font-family=“Arial, Helvetica, sans-serif”
font-size=“11”
font-weight=“500”
fill=”#c4a050”
text-anchor=“middle”
letter-spacing=“8”
opacity=“0.4”

> EST. NIGERIA</text>

</svg>